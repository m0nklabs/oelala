# Gitleaks configuration for oelala
# Extends default rules with custom allowlists

[extend]
# Use default gitleaks rules
useDefault = true

[allowlist]
# Ignore documentation files with placeholder tokens
paths = [
    '''docs/.*\.md$''',
    '''\.example$''',
    '''examples/.*''',
    # SDK README contains placeholder API keys in examples
    '''sdk/README\.md$''',
    # Ignore ComfyUI submodule/vendor directory
    '''ComfyUI/.*''',
    # Ignore external dependencies
    '''external/.*''',
    # Ignore generated files
    '''generated/.*''',
    # Ignore test files with test/mock API keys
    '''tests/.*\.py$''',
]

# Ignore specific placeholder patterns
regexes = [
    '''YOUR_[A-Z_]+''',
    '''<YOUR_.*>''',
    '''\$\{[A-Z_]+\}''',
    # Ignore oelala placeholder/test keys
    '''oelala_(invalid|test|your)_key\w*''',
]

# Ignore these specific strings (case-insensitive)
stopwords = [
    "YOUR_JWT_TOKEN",
    "YOUR_API_KEY",
    "YOUR_SECRET",
    "PLACEHOLDER",
    "example_token",
    "oelala_invalid_key",
    "oelala_test_key",
    "oelala_your_key_here",
]
