# Pre-commit hooks
# See https://pre-commit.com for more information
#
# Excluded directories:
# - ComfyUI/: External submodule/dependency
# - workflows/: ComfyUI-generated JSON files
# - scripts/: Legacy utility scripts
# - data/: Benchmark/experiment data
# - examples/: Example/demo scripts
# - external/: External dependencies

# Global exclude pattern
exclude: ^(ComfyUI/|workflows/|scripts/|data/|examples/|external/|generated/|media/|uploads/|build/|logs/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # Pinned to the same version as the CI lint step (see .github/workflows/ci.yml):
  # two gates that format or lint with different ruff versions can disagree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^src/
      - id: ruff-format
        files: ^src/

  # Assert AGENTS.md sync-copies stay in sync (single source of truth).
  - repo: local
    hooks:
      - id: sync-agent-docs
        name: Sync tool-native agent docs (CLAUDE.md, .goosehints)
        entry: bash scripts/sync-agent-docs.sh
        language: system
        pass_filenames: false
        always_run: true
        files: ^(AGENTS\.md|CLAUDE\.md|\.goosehints)$
