name: Changelog Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  check-changelog:
    name: Check changelog fragment exists
    runs-on: [self-hosted, Linux, ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changelog fragment
        id: changelog
        run: |
          # Get PR number
          PR_NUMBER="${{ github.event.pull_request.number }}"
          
          # Get list of changed files in this PR
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check for changelog fragment file matching PR number
          if echo "$CHANGED_FILES" | grep -qE "^changelog/${PR_NUMBER}-.*\.md$"; then
            echo "✅ Changelog fragment for PR #${PR_NUMBER} found"
            echo "updated=true" >> $GITHUB_OUTPUT
          # Also accept any new file in changelog/ directory
          elif echo "$CHANGED_FILES" | grep -qE "^changelog/.*\.md$"; then
            echo "✅ Changelog fragment found"
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "❌ No changelog fragment found"
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail if no changelog fragment
        if: steps.changelog.outputs.updated == 'false'
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "::error::Changelog fragment required for this PR!"
          echo ""
          echo "Please create a changelog fragment file:"
          echo "  changelog/${PR_NUMBER}-short-description.md"
          echo ""
          echo "Example content:"
          echo "### Added"
          echo "- New feature description"
          echo ""
          echo "See changelog/README.md for details."
          exit 1

      - name: Success message
        if: steps.changelog.outputs.updated == 'true'
        run: |
          echo "✅ Changelog fragment found - good job!"
