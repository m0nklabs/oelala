name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ensure pre-commit can build hook environments
        run: |
          # The runner's virtualenv is missing filelock, so pre-commit cannot
          # create an environment for a hook whose rev changed (measured
          # 2026-11-05: "ModuleNotFoundError: No module named 'filelock'" while
          # initialising ruff-pre-commit). Repairing it here keeps hook bumps
          # possible instead of silently pinning every hook forever.
          python -m pip install --upgrade virtualenv

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  backend:
    name: Backend (ruff + pytest)
    runs-on: [self-hosted, Linux]

    # This job is a real gate: every step fails the build. The GPU and integration
    # suites are deliberately out of scope here — they need a live ComfyUI / MinIO /
    # Supabase and belong on the dedicated runner (`-m gpu` / `-m integration`).

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install web dependencies
        run: |
          python -m pip install --upgrade pip
          # Hard install: this manifest must be able to run the backend. A missing
          # pin here has to fail the job, not be skipped.
          python -m pip install -r requirements-web.txt
          # ruff is pinned on purpose. Installed unpinned it resolves to whatever the
          # self-hosted runner has cached (0.15.0 at the time of writing), and a runner
          # image update would silently change what "lint passes" means — ruff 0.17
          # reports 1610 findings on this same tree (issue #238). Keep this in step with
          # the rev in .pre-commit-config.yaml.
          python -m pip install pytest pytest-asyncio pytest-cov "ruff==0.15.0"

      - name: Backend imports (manifest drift check)
        run: |
          python -c "import sys; sys.path.insert(0, 'src/backend'); import app"

      - name: Lint
        run: |
          ruff check src/

      - name: Unit Tests
        run: |
          pytest tests/ -q --cov=src/backend --cov-report=xml \
            --ignore=tests/gpu --ignore=tests/manual \
            -m "not gpu and not integration"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend (build)
    runs-on: [self-hosted, Linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint
        working-directory: src/frontend
        run: npm run lint

      - name: Run tests
        working-directory: src/frontend
        run: npm test -- --run || true

      - name: Build
        working-directory: src/frontend
        run: npm run build
