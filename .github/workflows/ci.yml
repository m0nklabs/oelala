name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix:
    name: Auto-fix style (PRs only)
    runs-on: [self-hosted, Linux]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fix style issues
        run: |
          pip install ruff pre-commit -q

          # Run pre-commit autofixes (end-of-file, trailing whitespace, etc.)
          pre-commit run --all-files || true

          # Additional ruff fixes (sometimes pre-commit ruff misses things)
          ruff check --fix . || true
          ruff format . || true

      - name: Commit and push fixes
        run: |
          # Exclude workflow files - GitHub Apps can't push to them
          git checkout -- .github/workflows/ 2>/dev/null || true

          if git diff --quiet; then
            echo "No style fixes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-fix whitespace and formatting"
            git push
            echo "Style fixes pushed - CI will re-run"
          fi

  pre-commit:
    name: Pre-commit checks
    runs-on: [self-hosted, Linux]
    needs: [autofix]
    if: always() && (needs.autofix.result == 'success' || needs.autofix.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  backend:
    name: Backend (ruff + pytest)
    runs-on: [self-hosted, Linux]
    needs: [autofix]
    if: always() && (needs.autofix.result == 'success' || needs.autofix.result == 'skipped')

    # This job is a real gate: every step fails the build. The GPU and integration
    # suites are deliberately out of scope here — they need a live ComfyUI / MinIO /
    # Supabase and belong on the dedicated runner (`-m gpu` / `-m integration`).

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install web dependencies
        run: |
          python -m pip install --upgrade pip
          # Hard install: this manifest must be able to run the backend. A missing
          # pin here has to fail the job, not be skipped.
          python -m pip install -r requirements-web.txt
          python -m pip install pytest pytest-asyncio pytest-cov ruff

      - name: Backend imports (manifest drift check)
        run: |
          python -c "import sys; sys.path.insert(0, 'src/backend'); import app"

      - name: Lint
        run: |
          ruff check src/

      - name: Unit Tests
        run: |
          pytest tests/ -q --cov=src/backend --cov-report=xml \
            --ignore=tests/gpu --ignore=tests/manual \
            -m "not gpu and not integration"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend (build)
    runs-on: [self-hosted, Linux]
    needs: [autofix]
    if: always() && (needs.autofix.result == 'success' || needs.autofix.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint
        working-directory: src/frontend
        run: npm run lint

      - name: Run tests
        working-directory: src/frontend
        run: npm test -- --run || true

      - name: Build
        working-directory: src/frontend
        run: npm run build
