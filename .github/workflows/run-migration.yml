name: Run DB Migration

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Path to SQL migration file'
        required: true
        default: 'supabase/migrations/012_tool_profiles.sql'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply SQL migration
    runs-on: [self-hosted, Linux, ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run migration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          echo "📄 Migration: ${{ github.event.inputs.migration_file }}"

          if [ ! -f "${{ github.event.inputs.migration_file }}" ]; then
            echo "❌ File not found: ${{ github.event.inputs.migration_file }}"
            exit 1
          fi

          # Try direct psql first
          if command -v psql &>/dev/null && [ -n "$DATABASE_URL" ]; then
            echo "🔌 Using psql with DATABASE_URL..."
            psql "$DATABASE_URL" -f "${{ github.event.inputs.migration_file }}"
            echo "✅ Migration applied via psql!"
            exit 0
          fi

          # Fallback: Python + psycopg2
          echo "🐍 Using Python + psycopg2..."
          pip install psycopg2-binary -q 2>/dev/null || true

          python3 - <<'PYEOF'
          import os, sys

          db_url = os.environ.get('DATABASE_URL', '')
          db_pass = os.environ.get('DATABASE_PASSWORD', '')
          supa_url = os.environ.get('SUPABASE_URL', '')

          if not db_url and db_pass and supa_url:
              ref = supa_url.split('//')[1].split('.')[0]
              db_url = f"postgresql://postgres.{ref}:{db_pass}@aws-0-eu-central-1.pooler.supabase.com:6543/postgres"

          if not db_url:
              print("❌ No DATABASE_URL or DATABASE_PASSWORD available")
              sys.exit(1)

          import psycopg2
          with open("${{ github.event.inputs.migration_file }}") as f:
              sql = f.read()

          print(f"📊 SQL size: {len(sql)} bytes")
          conn = psycopg2.connect(db_url)
          conn.autocommit = True
          cur = conn.cursor()
          cur.execute(sql)
          print("✅ Migration applied!")
          cur.close()
          conn.close()
          PYEOF
