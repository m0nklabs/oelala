name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Sunday at 3am
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security Scan
    runs-on: [self-hosted, Linux, ci]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit pip-audit -q

      - name: Bandit (Python code security)
        run: |
          echo "🔍 Scanning Python code for security issues..."
          bandit -r src/ -ll -ii --format txt || true
          # -ll = medium+ severity, -ii = medium+ confidence

      - name: pip-audit (dependency vulnerabilities)
        run: |
          echo "🔍 Checking dependencies for known vulnerabilities..."
          pip-audit -r requirements.txt --progress-spinner off || true
