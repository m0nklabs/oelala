name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: [self-hosted, Linux, ci]
    steps:
      - uses: actions/labeler@v5
        if: github.event_name == 'pull_request'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

      # Add copilot label for Copilot branches
      - name: Label Copilot PRs
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'copilot/')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['copilot']
            });

      # Add WIP label for draft PRs
      - name: Label draft PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['work-in-progress']
            });

      # Remove WIP label when PR is marked ready for review
      - name: Remove WIP label when ready
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'work-in-progress'
              });
              console.log('Removed work-in-progress label');
            } catch (e) {
              // Label might not exist, that's okay
              console.log('Label not found or already removed');
            }

      # Remove WIP label when PR is approved
      - name: Remove WIP label on approval
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'work-in-progress'
              });
              console.log('Removed work-in-progress label after approval');
            } catch (e) {
              // Label might not exist, that's okay
              console.log('Label not found or already removed');
            }
