name: Auto-assign Copilot (Simple)

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to assign to Copilot'
        required: false
        type: number

permissions:
  issues: write
  contents: read

jobs:
  assign-copilot:
    runs-on: [self-hosted, Linux, ci]
    # Only run if labeled with 'copilot' or manual dispatch
    if: github.event.label.name == 'copilot' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Assign Copilot to issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issueNumber;
            
            if (context.eventName === 'workflow_dispatch') {
              issueNumber = ${{ inputs.issue_number || 0 }};
              if (!issueNumber) {
                // Find first open issue with copilot label
                const { data: issues } = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  labels: 'copilot',
                  per_page: 1
                });
                if (issues.length === 0) {
                  console.log('No issues with copilot label found');
                  return;
                }
                issueNumber = issues[0].number;
              }
            } else {
              issueNumber = context.payload.issue.number;
            }
            
            console.log(`Assigning Copilot to issue #${issueNumber}`);

            // Step 1: Assign Copilot to the issue
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: ['copilot-swe-agent[bot]']
              });
              console.log(`✅ Assigned copilot-swe-agent to issue #${issueNumber}`);
            } catch (e) {
              console.log(`⚠️ Could not assign copilot-swe-agent: ${e.message}`);
              // Continue anyway - the mention will still work
            }

            // Step 2: Add comment mentioning @copilot to trigger it
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '@copilot Please implement this issue.'
            });

            console.log(`✅ Mentioned @copilot on issue #${issueNumber}`);
