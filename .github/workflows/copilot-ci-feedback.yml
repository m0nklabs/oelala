name: Copilot CI Feedback

on:
  workflow_run:
    workflows: ["CI", "Copilot Branch CI", "Changelog Check"]
    types: [completed]
  # Allow manual/automated triggering for blocked runs
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to check for failed CI'
        required: true
        type: string
      run_id:
        description: 'Failed workflow run ID (optional)'
        required: false
        type: string

permissions:
  pull-requests: write
  actions: read

jobs:
  notify-copilot:
    name: Notify Copilot of CI failures
    # Run if: workflow_run with failure on copilot branch, OR manual dispatch
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'failure' &&
       startsWith(github.event.workflow_run.head_branch, 'copilot/'))
    runs-on: [self-hosted, Linux, ci]
    steps:
      - name: Get PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Handle both workflow_run and workflow_dispatch events
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            HEAD_BRANCH="${{ inputs.branch }}"
            # Get latest commit SHA for the branch
            HEAD_SHA=$(gh api repos/${{ github.repository }}/git/refs/heads/$HEAD_BRANCH --jq '.object.sha' 2>/dev/null || echo "")
          else
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          SHORT_SHA="${HEAD_SHA:0:7}"

          echo "head_branch=$HEAD_BRANCH" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # Find PR for this branch
          PR_DATA=$(gh api repos/${{ github.repository }}/pulls \
            --jq ".[] | select(.head.ref == \"$HEAD_BRANCH\" and .state == \"open\") | {number, author: .user.login}" \
            | head -1)

          if [ -z "$PR_DATA" ]; then
            echo "No open PR found for branch $HEAD_BRANCH"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number')
          PR_AUTHOR=$(echo "$PR_DATA" | jq -r '.author')

          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "author=$PR_AUTHOR" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT

          # Check if Copilot PR
          PR_AUTHOR_LOWER=$(echo "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')
          if [[ "$PR_AUTHOR_LOWER" == *"copilot"* ]] || [[ "$HEAD_BRANCH" == copilot/* ]]; then
            echo "is_copilot=true" >> $GITHUB_OUTPUT
          else
            echo "is_copilot=false" >> $GITHUB_OUTPUT
          fi

      - name: Check loop protection
        if: steps.pr.outputs.found == 'true' && steps.pr.outputs.is_copilot == 'true'
        id: loop_check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          SHORT_SHA="${{ steps.pr.outputs.short_sha }}"

          # Get recent comments
          COMMENTS=$(gh api repos/${{ github.repository }}/issues/$PR_NUMBER/comments --jq '.')

          # Count @copilot fix requests in last 2 hours
          TWO_HOURS_AGO=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENT_FIX_REQUESTS=$(echo "$COMMENTS" | jq --arg since "$TWO_HOURS_AGO" '
            [.[] | select(
              (.body | contains("@copilot")) and
              (.body | ascii_downcase | contains("fix") or contains("failed")) and
              (.created_at > $since)
            )] | length')

          echo "recent_requests=$RECENT_FIX_REQUESTS" >> $GITHUB_OUTPUT

          # Check if already requested for this SHA
          ALREADY_REQUESTED=$(echo "$COMMENTS" | jq --arg sha "$SHORT_SHA" '
            [.[] | select(.body | contains($sha))] | length')

          if [ "$ALREADY_REQUESTED" -gt 0 ]; then
            echo "Already requested fix for commit $SHORT_SHA"
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=sha_duplicate" >> $GITHUB_OUTPUT
            exit 0
          fi

          MAX_REQUESTS=2
          if [ "$RECENT_FIX_REQUESTS" -ge "$MAX_REQUESTS" ]; then
            echo "Loop protection: $RECENT_FIX_REQUESTS requests in last 2 hours - escalating to manual"
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=loop_protection" >> $GITHUB_OUTPUT
            echo "request_count=$RECENT_FIX_REQUESTS" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          NEXT_REQUEST=$((RECENT_FIX_REQUESTS + 1))
          echo "request_num=$NEXT_REQUEST" >> $GITHUB_OUTPUT

      - name: Get failed jobs
        if: steps.pr.outputs.found == 'true' && steps.pr.outputs.is_copilot == 'true' && steps.loop_check.outputs.skip != 'true'
        id: failures
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          HEAD_BRANCH="${{ steps.pr.outputs.head_branch }}"

          # Handle both workflow_run and workflow_dispatch events
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.run_id }}" ]; then
            RUN_ID="${{ inputs.run_id }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Find the most recent failed run for this branch
            RUN_ID=$(gh api repos/${{ github.repository }}/actions/runs \
              --jq "[.workflow_runs[] | select(.head_branch == \"$HEAD_BRANCH\" and .conclusion == \"failure\")] | first | .id" \
              2>/dev/null || echo "")
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi

          if [ -z "$RUN_ID" ]; then
            echo "No failed run found"
            echo "jobs=Unknown (no run ID)" >> $GITHUB_OUTPUT
            echo "url=https://github.com/${{ github.repository }}/actions" >> $GITHUB_OUTPUT
            exit 0
          fi

          FAILED_JOBS=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' 2>/dev/null || echo "Unknown")

          RUN_URL=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID --jq '.html_url' 2>/dev/null || echo "https://github.com/${{ github.repository }}/actions")

          echo "jobs=$FAILED_JOBS" >> $GITHUB_OUTPUT
          echo "url=$RUN_URL" >> $GITHUB_OUTPUT

      - name: Notify Copilot to fix
        if: steps.pr.outputs.found == 'true' && steps.pr.outputs.is_copilot == 'true' && steps.loop_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          SHORT_SHA="${{ steps.pr.outputs.short_sha }}"
          FAILED_JOBS="${{ steps.failures.outputs.jobs }}"
          RUN_URL="${{ steps.failures.outputs.url }}"
          REQUEST_NUM="${{ steps.loop_check.outputs.request_num }}"

          cat <<EOF > /tmp/comment.md
          @copilot CI failed on commit \`${SHORT_SHA}\`. Please fix the following issues and push again:

          **Failed checks:** ${FAILED_JOBS}

          [View failed run](${RUN_URL})

          _Auto-fix request ${REQUEST_NUM}/2_
          EOF

          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          echo "Requested Copilot to fix CI failures on PR #$PR_NUMBER"

      - name: Escalate to manual intervention
        if: steps.loop_check.outputs.reason == 'loop_protection'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          REQUEST_COUNT="${{ steps.loop_check.outputs.request_count }}"

          # Add label for manual intervention
          gh api repos/${{ github.repository }}/issues/$PR_NUMBER/labels \
            -X POST -f "labels[]=needs-manual-help" 2>/dev/null || true

          cat <<EOF > /tmp/alert.md
          ## 🆘 Escalation: Manual Intervention Required

          Copilot has failed to fix CI after **${REQUEST_COUNT} attempts**.

          **Next steps:**
          1. Open VS Code Copilot Chat
          2. Discuss the remaining issues with Copilot Chat
          3. Push fixes or provide specific guidance

          The PR has been labeled \`needs-manual-help\`.

          cc @m0nk1111
          EOF

          gh pr comment "$PR_NUMBER" --body-file /tmp/alert.md
          echo "Escalation posted on PR #$PR_NUMBER"
