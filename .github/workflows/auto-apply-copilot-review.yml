# Auto-respond to Copilot PR reviews
#
# When Copilot PR Reviewer leaves comments, automatically ask the
# Copilot Coding Agent to apply the suggested changes.

name: Auto-Apply Copilot Review

on:
  pull_request_review:
    types: [submitted]

jobs:
  auto-apply-review:
    # Only run for Copilot PR Reviewer reviews with comments
    if: |
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' &&
      github.event.review.state == 'COMMENTED' &&
      github.event.pull_request.user.login == 'copilot-swe-agent[bot]'
    
    runs-on: ubuntu-latest
    
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Add comment to apply review suggestions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const reviewId = context.payload.review.id;
            const reviewUrl = context.payload.review.html_url;
            
            // Check if we already commented on this review
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const alreadyCommented = comments.data.some(c => 
              c.body.includes(`review-${reviewId}`) && 
              c.user.login === 'github-actions[bot]'
            );
            
            if (alreadyCommented) {
              console.log('Already commented on this review, skipping');
              return;
            }
            
            // Post comment asking Copilot to apply changes
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `@copilot apply the changes based on the review comments in ${reviewUrl}\n\n<!-- review-${reviewId} -->`
            });
            
            console.log(`Posted auto-apply comment for review ${reviewId}`);
