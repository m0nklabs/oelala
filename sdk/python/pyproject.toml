[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oelala"
version = "0.1.0"
description = "Official Python SDK for the Oelala AI generation API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Oelala", email = "dev@oelala.xyz" },
]
keywords = ["ai", "video-generation", "image-generation", "oelala", "wan2.2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
async = ["httpx[http2]>=0.25.0"]

[project.urls]
Homepage = "https://oelala.xyz"
Documentation = "https://oelala.xyz/docs"
Repository = "https://github.com/Oelala-xyz/oelala-python"

[tool.hatch.build.targets.wheel]
packages = ["oelala"]
