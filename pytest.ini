[pytest]
# Pytest configuration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
norecursedirs = .git .github build dist

# Exclude standalone verification/check scripts from test discovery
# These are meant to be run manually, not as part of the test suite
addopts = --ignore=tests/verify_credits_implementation.py

# Register custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests that require GPU and running services (run only on gpu runner)
    integration: marks integration tests

# Async support
asyncio_mode = auto
